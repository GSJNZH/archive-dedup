name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m py_compile archive_dedup.py archive_dedup_cli.py selftest.py
          python selftest.py

      - name: Build executables
        run: pwsh -NoProfile -File build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveDedup-windows
          path: dist/ArchiveDedup-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArchiveDedup-windows.zip
